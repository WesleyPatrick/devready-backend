# Configuração do Judge0 usada pelos containers judge0-*.
# Referência completa das chaves: https://github.com/judge0/judge0/blob/master/judge0.conf

# Infra interna do Judge0 (separada do PostgreSQL e do Redis da aplicação)
REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=devready-judge0-redis
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=devready-judge0-db

# Limites por processo, sem cgroup. O isolate do Judge0 1.13.1 só conhece cgroup v1; com cgroup v2
# (OrbStack no Mac, Docker Desktop e Linux recentes) toda submissão volta com Internal Error.
# Neste modo o limite de memória vira limite de espaço de endereço: sob a emulação do Mac a JVM só
# sobe com 8 GB, e Python e Node com 4 GB. O worker manda esses valores por linguagem.
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true

# Limites padrão; o worker manda o tempo do desafio e a memória da linguagem em cada envio
CPU_TIME_LIMIT=5
MAX_CPU_TIME_LIMIT=15
WALL_TIME_LIMIT=10
MAX_WALL_TIME_LIMIT=20
MEMORY_LIMIT=4194304
MAX_MEMORY_LIMIT=8388608
MAX_QUEUE_SIZE=100

# O código do candidato não fala com a rede, e o envio não pode ligá-la
ENABLE_NETWORK=false
ALLOW_ENABLE_NETWORK=false

# Sem espera síncrona: o worker pergunta o resultado
ENABLE_WAIT_RESULT=false
ENABLE_BATCHED_SUBMISSIONS=false
JUDGE0_TELEMETRY_ENABLE=false
