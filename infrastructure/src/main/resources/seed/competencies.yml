# Nome, slug e categoria são os do glossário da pesquisa de vagas; resumo, tags e dificuldade foram
# escritos para a plataforma, fora da pesquisa.
- slug: estruturas-de-dados-e-algoritmos
  name: Estruturas de dados e algoritmos
  category: fundamento
  difficulty: medium
  summary: >-
    Listas, mapas, pilhas, árvores e grafos, com o custo de cada operação. É a base dos testes de código das entrevistas, do teste online à conversa com o time.
  tags: [estruturas-de-dados, algoritmos, arrays, strings, hash-map, complexidade, recursao]
- slug: design-de-sistemas
  name: Design de sistemas
  category: fundamento
  difficulty: hard
  summary: >-
    Escala, cache, filas, particionamento e consistência. É a conversa de quadro branco das entrevistas de pleno para cima.
  tags: [arquitetura, cache, mensageria]
- slug: sql-e-modelagem-de-dados
  name: SQL e modelagem de dados
  category: fundamento
  difficulty: medium
  summary: >-
    Consultas com junção e agregação, índices, transações e como modelar tabelas para o que a aplicação precisa ler e gravar.
  tags: [sql, banco-de-dados, orm]
- slug: apis-rest
  name: APIs REST
  category: pratica
  difficulty: easy
  summary: >-
    Métodos, status, idempotência e como desenhar recursos HTTP que outro time consegue usar sem perguntar.
  tags: [http, rest]
- slug: testes-automatizados
  name: Testes automatizados
  category: pratica
  difficulty: easy
  summary: >-
    Testes de unidade e de integração, dublês de teste e como um teste prova que pega o erro que diz pegar.
  tags: [testes]
- slug: git-e-fluxo-de-codigo
  name: Git e fluxo de código
  category: pratica
  difficulty: easy
  summary: >-
    Ramos, merge, rebase, conflitos e revisão de código: o dia a dia de quem trabalha num repositório com outras pessoas.
  tags: [git]
- slug: nuvem
  name: Nuvem
  category: pratica
  difficulty: medium
  summary: >-
    Os serviços básicos de um provedor (computação, armazenamento, rede, filas) e o que muda quando a infraestrutura é alugada por uso.
  tags: [nuvem, infraestrutura-como-codigo, redes]
- slug: containers-e-orquestracao
  name: Containers e orquestração
  category: pratica
  difficulty: medium
  summary: >-
    Imagens, contêineres e como um orquestrador como o Kubernetes mantém a aplicação no ar, recriando o que cai.
