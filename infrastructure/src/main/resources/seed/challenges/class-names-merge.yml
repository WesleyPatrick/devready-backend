slug: class-names-merge
title: Montar o atributo class sem repetição
area: frontend
level: pleno
difficulty: medium
tags: [strings, hash-map, css]
timeLimitMs: 5000
memoryLimitKb: 262144
comparison: exact
statement: |
  Ao montar o atributo `class` de um componente, é comum juntar pedaços condicionais, no estilo de bibliotecas como `clsx` ou `classnames` (que não removem repetidas), e aqui você também quer evitar que uma classe apareça duas vezes. Você recebe uma lista de pedaços de texto e, em paralelo, uma lista de booleanos dizendo se cada pedaço está ativo.

  Regras:
  - Só os pedaços ativos entram. Cada pedaço pode ter várias classes separadas por qualquer quantidade de espaços (só o caractere espaço; não há tabulação nem quebra de linha), ter espaços nas pontas ou ser vazio.
  - Se uma classe aparece mais de uma vez, vale a **última** ocorrência: ela some das posições anteriores e fica na posição da última vez que apareceu.
  - Devolva as classes que sobraram, na ordem, separadas por um único espaço. Sem classes, devolva o texto vazio.
  - As duas listas têm o mesmo tamanho.

  Exemplo: os pedaços `["btn primary", "btn-lg", "btn"]`, todos ativos, produzem `"primary btn-lg btn"`.
approachSummary: |
  Percorra os pedaços ativos, quebre cada um em classes (ignorando espaços repetidos e pedaços vazios) e use um mapa que preserva a ordem de inserção: ao ver uma classe, remova-a do mapa se já estiver lá e insira de novo, o que a leva para o fim. No final, as chaves do mapa, na ordem, são o resultado, e basta juntá-las com um espaço. Outra forma é gravar o último índice de cada classe e filtrar a lista na segunda passada. Custo O(n) no total de caracteres, com memória proporcional às classes distintas.
