    referenceSolution: |
      import java.util.LinkedHashSet;
      import java.util.Set;

      class Solution {
          public String mergeClassNames(String[] parts, boolean[] enabled) {
              Set<String> classes = new LinkedHashSet<>();
              for (int i = 0; i < parts.length; i++) {
                  if (!enabled[i]) {
                      continue;
                  }
                  for (String name : parts[i].trim().split("\\s+")) {
                      if (name.isEmpty()) {
                          continue;
                      }
                      classes.remove(name);
                      classes.add(name);
                  }
              }
              return String.join(" ", classes);
          }
      }
