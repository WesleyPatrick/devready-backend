    referenceSolution: |
      class Solution:
          def merge_class_names(self, parts, enabled):
              classes = {}
              for part, active in zip(parts, enabled):
                  if not active:
                      continue
                  for name in part.split():
                      classes.pop(name, None)
                      classes[name] = True
              return " ".join(classes)
