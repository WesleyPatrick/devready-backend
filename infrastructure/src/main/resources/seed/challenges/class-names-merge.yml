      class Solution {
        mergeClassNames(parts, enabled) {
          const classes = new Set();
          parts.forEach((part, i) => {
            if (!enabled[i]) return;
            for (const name of part.split(/\s+/)) {
              if (name === "") continue;
              classes.delete(name);
              classes.add(name);
            }
          });
          return Array.from(classes).join(" ");
        }
      }
