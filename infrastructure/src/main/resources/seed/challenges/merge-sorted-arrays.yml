    referenceSolution: |
      class Solution {
        merge(a, b) {
          const result = [];
          let i = 0;
          let j = 0;
          while (i < a.length && j < b.length) {
            result.push(a[i] <= b[j] ? a[i++] : b[j++]);
          }
          while (i < a.length) result.push(a[i++]);
          while (j < b.length) result.push(b[j++]);
          return result;
        }
      }
