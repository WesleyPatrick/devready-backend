slug: merge-sorted-arrays
title: Mesclar arrays ordenados
area: backend
level: junior
difficulty: medium
tags: [arrays, algoritmos, complexidade]
timeLimitMs: 5000
memoryLimitKb: 262144
comparison: exact
statement: |
  Você recebe dois arrays de inteiros, `a` e `b`, cada um já em ordem crescente (podem ter valores repetidos e podem estar vazios). Devolva um único array em ordem crescente com todos os elementos dos dois, mantendo as repetições.

  Resolva sem concatenar e ordenar de novo: o objetivo é aproveitar que os dois já estão ordenados.

  Exemplo: `a = [1, 3, 5]` e `b = [2, 4, 6]` produzem `[1, 2, 3, 4, 5, 6]`.
approachSummary: |
  Use dois ponteiros, um no início de cada array. A cada passo, copie para o resultado o menor dos dois elementos apontados e avance aquele ponteiro; quando um dos arrays acabar, copie o que sobrou do outro. Isso é a etapa de junção do merge sort: O(n + m) de tempo e O(n + m) de memória para o resultado. Concatenar e ordenar funciona, mas custa O((n + m) log(n + m)).
