              # sua solução
              return []
    referenceSolution: |
      class Solution:
          def merge(self, a, b):
              result = []
              i = j = 0
              while i < len(a) and j < len(b):
                  if a[i] <= b[j]:
                      result.append(a[i])
                      i += 1
                  else:
                      result.append(b[j])
                      j += 1
              result.extend(a[i:])
              result.extend(b[j:])
              return result
