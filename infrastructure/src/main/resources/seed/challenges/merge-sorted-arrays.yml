  java:
    functionName: merge
    starterCode: |
      class Solution {
          public int[] merge(int[] a, int[] b) {
              // sua solução
              return new int[0];
          }
      }
    referenceSolution: |
      class Solution {
          public int[] merge(int[] a, int[] b) {
              int[] result = new int[a.length + b.length];
              int i = 0;
              int j = 0;
              int k = 0;
              while (i < a.length && j < b.length) {
                  result[k++] = a[i] <= b[j] ? a[i++] : b[j++];
              }
              while (i < a.length) {
                  result[k++] = a[i++];
              }
              while (j < b.length) {
                  result[k++] = b[j++];
              }
              return result;
          }
      }
  python:
