slug: valid-parentheses
title: Parênteses balanceados
area: backend
level: junior
difficulty: easy
tags: [estruturas-de-dados, strings, algoritmos]
timeLimitMs: 5000
memoryLimitKb: 262144
comparison: exact
statement: |
  Dada uma string `s` formada apenas pelos caracteres `(`, `)`, `[`, `]`, `{` e `}`, diga se ela está balanceada.

  Uma string está balanceada quando todo símbolo de abertura é fechado pelo símbolo do mesmo tipo e na ordem correta: o último aberto é o primeiro a ser fechado. A string vazia está balanceada.

  Exemplo: `"{[]}"` está balanceada e devolve `true`; `"([)]"` não está, porque o `[` é fechado depois do `)`, e devolve `false`.
approachSummary: |
  Use uma pilha. Ao ler um símbolo de abertura, empilhe; ao ler um de fechamento, a pilha não pode estar vazia e o topo precisa ser a abertura correspondente, que é desempilhada. No fim, a string só é válida se a pilha estiver vazia. Uma passada, O(n) de tempo e O(n) de memória no pior caso. O erro comum é só contar aberturas e fechamentos, o que aceita `"([)]"`.
