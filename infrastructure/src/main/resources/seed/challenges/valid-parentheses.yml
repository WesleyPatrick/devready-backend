    referenceSolution: |
      class Solution:
          def is_valid(self, s):
              pairs = {")": "(", "]": "[", "}": "{"}
              stack = []
              for c in s:
                  if c in "([{":
                      stack.append(c)
                  elif not stack or stack.pop() != pairs[c]:
                      return False
              return not stack
