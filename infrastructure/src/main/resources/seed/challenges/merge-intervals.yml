slug: merge-intervals
title: Fundir intervalos sobrepostos
area: backend
level: pleno
difficulty: medium
tags: [arrays, algoritmos, complexidade]
timeLimitMs: 5000
memoryLimitKb: 262144
comparison: exact
statement: |
  Você recebe uma lista de intervalos `[início, fim]` com inteiros, sempre com `início <= fim`, em qualquer ordem. Funda os intervalos que se sobrepõem ou se tocam (o fim de um é igual ao início do outro) e devolva a lista resultante em ordem crescente de início.

  Exemplo: `[[1, 3], [2, 6], [8, 10], [15, 18]]` produz `[[1, 6], [8, 10], [15, 18]]`, e `[[1, 4], [4, 5]]` produz `[[1, 5]]`. A lista pode estar vazia.
approachSummary: |
  Ordene os intervalos pelo início e percorra-os mantendo o intervalo corrente: se o início do próximo é menor ou igual ao fim do corrente, estenda o fim com o maior dos dois; senão, feche o corrente e comece outro. A ordenação domina o custo: O(n log n) de tempo e O(n) de memória para o resultado. Comparar todos os pares até não haver mais fusões também funciona, mas custa O(n²) ou mais.
