      class Solution {
        mergeIntervals(intervals) {
          const sorted = intervals.map((item) => [item[0], item[1]]).sort((a, b) => a[0] - b[0]);
          const result = [];
          for (const item of sorted) {
            const last = result[result.length - 1];
            if (last && item[0] <= last[1]) {
              last[1] = Math.max(last[1], item[1]);
            } else {
              result.push(item);
            }
          }
          return result;
        }
      }
