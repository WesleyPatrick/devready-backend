    referenceSolution: |
      class Solution {
        groupAnagrams(words) {
          const groups = new Map();
          for (const word of words) {
            const key = [...word].sort().join("");
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(word);
          }
          const result = [...groups.values()].map((group) => [...group].sort());
          result.sort((x, y) => (x[0] < y[0] ? -1 : x[0] > y[0] ? 1 : 0));
          return result;
        }
      }
testCases:
  - { args: [["amor", "roma", "pato", "sol", "ramo", "topa", "mora"]], expected: [["amor", "mora", "ramo", "roma"], ["pato", "topa"], ["sol"]], visible: true }
