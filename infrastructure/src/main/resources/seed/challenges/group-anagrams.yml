slug: group-anagrams
title: Agrupar anagramas
area: frontend
level: junior
difficulty: medium
tags: [strings, hash-map]
timeLimitMs: 5000
memoryLimitKb: 262144
comparison: exact
statement: |
  Dada uma lista de palavras em letras minúsculas sem acento, agrupe as que são anagramas entre si, isto é, que usam exatamente as mesmas letras nas mesmas quantidades. Palavras repetidas ficam no mesmo grupo, uma vez para cada ocorrência.

  Para a resposta ser única, ordene as palavras de cada grupo em ordem alfabética e ordene os grupos pela primeira palavra de cada um.

  Exemplo: `["amor", "roma", "pato", "sol", "ramo", "topa", "mora"]` produz `[["amor", "mora", "ramo", "roma"], ["pato", "topa"], ["sol"]]`.
approachSummary: |
  Dois anagramas têm a mesma assinatura: as letras da palavra em ordem alfabética (`roma` e `amor` viram `amor`). Use um mapa de assinatura para lista de palavras, ordene cada lista e, por fim, ordene os grupos pela primeira palavra. Montar os grupos custa O(n · k log k) para n palavras de tamanho até k, e as ordenações finais O(n log n) comparações. Comparar todos os pares de palavras funciona, mas é O(n²).
