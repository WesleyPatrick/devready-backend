    referenceSolution: |
      class Solution:
          def top_word(self, text):
              counts = {}
              word = []
              for c in text + " ":
                  if c.isalnum():
                      word.append(c)
                  elif word:
                      key = "".join(word).lower()
                      counts[key] = counts.get(key, 0) + 1
                      word = []
              best, best_count = "", 0
              for key, count in counts.items():
                  if count > best_count:
                      best, best_count = key, count
              return best
