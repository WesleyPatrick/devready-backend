slug: word-frequency
title: Palavra mais frequente
area: frontend
level: junior
difficulty: medium
tags: [strings, hash-map]
timeLimitMs: 5000
memoryLimitKb: 262144
comparison: exact
statement: |
  Dado um texto, devolva a palavra que aparece mais vezes, em letras minúsculas.

  Regras: uma palavra é uma sequência de letras (com ou sem acento) e dígitos; qualquer outro caractere, como espaço ou pontuação, separa palavras. Maiúsculas e minúsculas não importam (`Deploy` e `deploy` são a mesma palavra). Em caso de empate, vence a palavra que aparece primeiro no texto. Se o texto não tiver nenhuma palavra, devolva a string vazia.

  Exemplo: em `"Deploy, teste, deploy! Teste? deploy."`, `deploy` aparece três vezes e `teste` duas, então a resposta é `"deploy"`.
approachSummary: |
  Separe o texto em palavras, converta cada uma para minúsculas e conte num mapa que preserve a ordem da primeira ocorrência (`LinkedHashMap` em Java, `dict` em Python, `Map` em JavaScript). Depois percorra o mapa na ordem de inserção e troque de vencedora só quando a contagem for estritamente maior, o que resolve o empate a favor da primeira. O(n) de tempo e O(k) de memória para as k palavras distintas.
