    referenceSolution: |
      class Solution {
        topWord(text) {
          const words = text.toLowerCase().match(/[\p{L}\p{N}]+/gu) || [];
          const counts = new Map();
          for (const word of words) counts.set(word, (counts.get(word) || 0) + 1);
          let best = "";
          let bestCount = 0;
          for (const [word, count] of counts) {
            if (count > bestCount) {
              best = word;
              bestCount = count;
            }
          }
          return best;
        }
      }
