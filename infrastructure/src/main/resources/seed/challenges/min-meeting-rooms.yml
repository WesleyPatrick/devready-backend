      class Solution:
          def min_meeting_rooms(self, intervals):
              starts = sorted(iv[0] for iv in intervals)
              ends = sorted(iv[1] for iv in intervals)
              rooms = 0
              e = 0
              for s in starts:
                  if s < ends[e]:
                      rooms += 1
                  else:
                      e += 1
              return rooms
