slug: min-meeting-rooms
title: Salas de reunião necessárias
area: backend
level: senior
difficulty: medium
tags: [arrays, algoritmos, complexidade]
timeLimitMs: 5000
memoryLimitKb: 262144
comparison: exact
statement: |
  Você recebe `intervals`, uma lista de reuniões em que cada item é `[inicio, fim]` (com `inicio < fim`). Devolva o menor número de salas necessário para realizar todas as reuniões sem sobreposição dentro da mesma sala.

  Uma reunião que termina no instante `t` libera a sala para outra que começa em `t`: `[0, 5]` e `[5, 10]` cabem na mesma sala. A lista pode vir fora de ordem e pode ser vazia (resposta `0`). Limites: `0 <= n <= 10000` reuniões e `0 <= inicio < fim <= 1000000`.

  Exemplo: para `intervals = [[0, 30], [5, 10], [15, 20]]`, a resposta é `2`.
approachSummary: |
  Comparar cada reunião com todas as outras custa O(n²). A solução esperada separa os inícios e os fins em dois arrays e ordena cada um. Percorra os inícios: se o início atual é menor que o menor fim ainda não liberado, é preciso uma sala nova; senão, a sala daquele fim é reaproveitada (avance o ponteiro dos fins). O número de salas é o máximo de reuniões simultâneas. Tempo O(n log n) pela ordenação, memória O(n). Uma min-heap de fins dá a mesma complexidade.
