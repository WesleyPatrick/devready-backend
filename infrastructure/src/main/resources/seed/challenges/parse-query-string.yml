    referenceSolution: |
      from urllib.parse import unquote_plus


      class Solution:
          def parse_query_string(self, query):
              text = query[1:] if query.startswith("?") else query
              pairs = []
              for part in text.split("&"):
                  if not part:
                      continue
                  key, _, value = part.partition("=")
                  if not key:
                      continue
                  pairs.append([unquote_plus(key), unquote_plus(value)])
              return pairs
