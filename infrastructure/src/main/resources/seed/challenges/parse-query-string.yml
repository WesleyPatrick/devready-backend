    referenceSolution: |
      class Solution {
        parseQueryString(query) {
          const text = query.startsWith("?") ? query.slice(1) : query;
          const decode = (s) => decodeURIComponent(s.replace(/\+/g, " "));
          const pairs = [];
          for (const part of text.split("&")) {
            if (part === "") continue;
            const eq = part.indexOf("=");
            const key = eq < 0 ? part : part.slice(0, eq);
            const value = eq < 0 ? "" : part.slice(eq + 1);
            if (key === "") continue;
            pairs.push([decode(key), decode(value)]);
          }
          return pairs;
        }
      }
testCases:
  - { args: ["?a=1&b=2&a=3"], expected: [["a", "1"], ["b", "2"], ["a", "3"]], visible: true }
  - { args: ["q=a%26b%3Dc&t=1%2B1"], expected: [["q", "a&b=c"], ["t", "1+1"]], visible: true }
  - { args: [""], expected: [], visible: false }
  - { args: ["?"], expected: [], visible: false }
  - { args: ["flag&x=&y=2"], expected: [["flag", ""], ["x", ""], ["y", "2"]], visible: false }
  - { args: ["a=1&&=3&b=x=y"], expected: [["a", "1"], ["b", "x=y"]], visible: false }
  - { args: ["?k=um+dois%20tres"], expected: [["k", "um dois tres"]], visible: false }
