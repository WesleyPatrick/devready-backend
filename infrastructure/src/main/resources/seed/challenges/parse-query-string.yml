slug: parse-query-string
title: Ler a query string de uma URL
area: frontend
level: pleno
difficulty: easy
tags: [strings, http]
timeLimitMs: 5000
memoryLimitKb: 262144
comparison: exact
statement: |
  Você recebe a *query string* de uma URL, com ou sem o `?` inicial. Devolva os pares `[chave, valor]` na ordem em que aparecem, já decodificados, como lista de listas de texto. Chaves repetidas aparecem uma vez para cada ocorrência.

  Regras:
  - Os pares são separados por `&`, e cada um é separado no primeiro `=`; o valor pode conter outros `=` depois de decodificado.
  - Um par sem `=` tem valor vazio (`"flag"` vira `["flag", ""]`).
  - Ignore segmentos vazios (como o de `a=1&&b=2`) e pares cuja chave é vazia (como `=3`).
  - Decodifique `+` como espaço e `%XX` como o byte correspondente. As sequências `%XX` dos testes são válidas e decodificam para UTF-8 válido.

  Exemplo: `"?a=1&b=2&a=3"` produz `[["a", "1"], ["b", "2"], ["a", "3"]]`.
approachSummary: |
  Tire o `?` inicial, quebre em `&` e trate cada segmento uma vez: descarte o vazio, separe no primeiro `=` (com `indexOf` ou `partition`, nunca um `split` completo, que perderia os `=` do valor), descarte a chave vazia e decodifique chave e valor, trocando `+` por espaço antes ou durante a decodificação percentual. Como a ordem das chaves deve ser mantida e repetições são permitidas, uma lista de pares basta; um mapa perderia as ocorrências repetidas. Custo O(n) no tamanho do texto.
