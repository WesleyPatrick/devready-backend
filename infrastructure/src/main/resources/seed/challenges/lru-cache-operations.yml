slug: lru-cache-operations
title: Cache LRU por operações
area: backend
level: pleno
difficulty: medium
tags: [estruturas-de-dados, hash-map, cache]
timeLimitMs: 5000
memoryLimitKb: 262144
comparison: exact
statement: |
  Simule um cache LRU (menos recentemente usado) com a capacidade dada, que é pelo menos 1. As operações chegam como texto, em ordem:

  - `"put chave valor"` grava o valor (se a chave já existe, atualiza); se passar da capacidade, remove a chave usada há mais tempo.
  - `"get chave"` lê o valor.

  Tanto `put` quanto `get` de uma chave existente contam como uso recente. Chaves e valores são inteiros. Devolva a lista com o resultado de cada `get`, na ordem, usando `-1` quando a chave não está no cache.

  Exemplo: capacidade 2 e `["put 1 10", "put 2 20", "get 1", "put 3 30", "get 2"]` produzem `[10, -1]`, porque o `put 3 30` removeu a chave 2.
approachSummary: |
  Combine um mapa (acesso em O(1) por chave) com uma ordem de uso que permita mover um item para o "mais recente" e remover o "mais antigo" em O(1): uma lista duplamente encadeada, ou um mapa que preserva a ordem de inserção (`LinkedHashMap` com ordem de acesso, `OrderedDict`, `Map` do JavaScript apagando e reinserindo a chave). Cada operação custa O(1), e o total é O(n) para n operações, com O(capacidade) de memória. Guardar só uma lista e procurar a chave a cada operação custaria O(capacidade) por operação.
