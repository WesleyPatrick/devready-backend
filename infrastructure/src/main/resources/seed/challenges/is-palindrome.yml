    referenceSolution: |
      class Solution {
        isPalindrome(s) {
          const isAlnum = (c) => /[\p{L}\p{N}]/u.test(c);
          let left = 0;
          let right = s.length - 1;
          while (left < right) {
            if (!isAlnum(s[left])) {
              left++;
            } else if (!isAlnum(s[right])) {
              right--;
            } else {
              if (s[left].toLowerCase() !== s[right].toLowerCase()) return false;
              left++;
              right--;
            }
          }
          return true;
        }
      }
