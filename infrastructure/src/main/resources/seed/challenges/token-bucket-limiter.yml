    referenceSolution: |
      class Solution {
        rejectedRequests(times, capacity, refillMs) {
          let tokens = capacity;
          let credited = 0;
          const rejected = [];
          for (let i = 0; i < times.length; i++) {
            const refills = Math.floor(times[i] / refillMs);
            tokens = Math.min(capacity, tokens + (refills - credited));
            credited = refills;
            if (tokens > 0) {
              tokens--;
            } else {
              rejected.push(i);
            }
          }
          return rejected;
        }
      }
