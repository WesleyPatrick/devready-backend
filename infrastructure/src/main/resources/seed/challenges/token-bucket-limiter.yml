      class Solution:
          def rejected_requests(self, times, capacity, refill_ms):
              tokens = capacity
              credited = 0
              rejected = []
              for i, t in enumerate(times):
                  refills = t // refill_ms
                  tokens = min(capacity, tokens + (refills - credited))
                  credited = refills
                  if tokens > 0:
                      tokens -= 1
                  else:
                      rejected.append(i)
              return rejected
