        }
      }
    referenceSolution: |
      class Solution {
        histogramPercentiles(bounds, counts) {
          const merged = new Array(bounds.length).fill(0);
          let total = 0;
          for (const instance of counts) {
            for (let j = 0; j < bounds.length; j++) {
              merged[j] += instance[j];
              total += instance[j];
            }
          }
          if (total === 0) return [0, 0, 0];
          return [50, 95, 99].map((p) => {
            const rank = Math.floor((p * total + 99) / 100);
            let accumulated = 0;
            for (let j = 0; j < merged.length; j++) {
              accumulated += merged[j];
              if (accumulated >= rank) return bounds[j];
            }
            return 0;
          });
        }
      }
