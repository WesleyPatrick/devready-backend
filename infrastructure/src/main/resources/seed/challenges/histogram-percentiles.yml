    referenceSolution: |
      class Solution:
          def histogram_percentiles(self, bounds, counts):
              merged = [0] * len(bounds)
              for instance in counts:
                  for j, value in enumerate(instance):
                      merged[j] += value
              total = sum(merged)
              if total == 0:
                  return [0, 0, 0]
              result = []
              for p in (50, 95, 99):
                  rank = (p * total + 99) // 100
                  accumulated = 0
                  for j, value in enumerate(merged):
                      accumulated += value
                      if accumulated >= rank:
                          result.append(bounds[j])
                          break
              return result
  javascript:
    functionName: histogramPercentiles
    starterCode: |
      class Solution {
