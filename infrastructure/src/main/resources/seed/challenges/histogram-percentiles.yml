slug: histogram-percentiles
title: Percentis a partir de histogramas
area: devops
level: pleno
difficulty: medium
tags: [observabilidade, algoritmos, arrays]
timeLimitMs: 5000
memoryLimitKb: 262144
comparison: exact
statement: |
  Cada instância de um serviço exporta um histograma de latência, em milissegundos, com os mesmos baldes (buckets) em todas as instâncias. `bounds` traz o limite superior de cada balde em ordem crescente (o balde `j` guarda as requisições com latência maior que `bounds[j-1]` e até `bounds[j]`; o primeiro começa em 0). `counts[i][j]` é quantas requisições a instância `i` registrou no balde `j`, **sem acumular**.

  Some as contagens de todas as instâncias e devolva `[p50, p95, p99]`: para cada percentil `p`, calcule `rank = ceil(p * total / 100)`, em que `total` é a soma de todas as contagens, e devolva o limite superior do **primeiro balde** cuja contagem acumulada (da esquerda para a direita) chega a pelo menos `rank`. Se `total` for 0, devolva `[0, 0, 0]`.

  Limites: de 1 a 50 baldes, de 0 a 100 instâncias (cada uma com um valor por balde, podendo ser zero), cada contagem entre 0 e 10^8 e `total` de no máximo 10^8. Quando o percentil cai exatamente na fronteira de um balde (a contagem acumulada é igual a `rank`), vale aquele balde.

  Exemplo: com `bounds = [10, 50, 100, 500]` e duas instâncias `[50, 30, 15, 5]` e `[40, 40, 15, 5]`, o total é 200 e as contagens acumuladas são 90, 160, 190 e 200. Para p50, `rank = 100` e o balde é o de 50; para p95, `rank = 190` e o balde é o de 100 (fronteira exata); para p99, `rank = 198` e o balde é o de 500. A resposta é `[50, 100, 500]`.
approachSummary: |
  Percentis não se combinam por média: o certo é somar as contagens balde a balde entre as instâncias e só então achar o percentil na distribuição agregada. Calcule o total, o posto de cada percentil como `(p * total + 99) / 100` em aritmética inteira (com `long` em Java, pois `p * total` passa de 2^31) e percorra as contagens somadas acumulando até alcançar o posto; o limite desse balde é a resposta. Custo O(I · B) para I instâncias e B baldes, com O(B) de memória. O erro comum é errar o balde na fronteira (usar `>` em vez de `>=`), estourar o inteiro e esquecer o caso sem amostras. A resposta é um limite de balde, não a latência exata: a precisão depende dos baldes escolhidos.
languages:
  java:
    functionName: histogramPercentiles
    starterCode: |
      class Solution {
          public int[] histogramPercentiles(int[] bounds, int[][] counts) {
              // sua solução
              return new int[]{0, 0, 0};
          }
      }
    referenceSolution: |
      class Solution {
          public int[] histogramPercentiles(int[] bounds, int[][] counts) {
              int buckets = bounds.length;
              long[] merged = new long[buckets];
              long total = 0;
              for (int[] instance : counts) {
                  for (int j = 0; j < buckets; j++) {
                      merged[j] += instance[j];
                      total += instance[j];
                  }
              }
              int[] result = new int[3];
              if (total == 0) {
                  return result;
              }
              int[] percentiles = {50, 95, 99};
              for (int k = 0; k < 3; k++) {
                  long rank = (percentiles[k] * total + 99) / 100;
                  long accumulated = 0;
                  for (int j = 0; j < buckets; j++) {
                      accumulated += merged[j];
                      if (accumulated >= rank) {
                          result[k] = bounds[j];
                          break;
                      }
                  }
              }
              return result;
          }
      }
