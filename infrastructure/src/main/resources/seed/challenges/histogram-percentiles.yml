  - { args: [[1, 2, 3], [[0, 0, 0], [50, 0, 0], [0, 0, 50]]], expected: [1, 3, 3], visible: false }
  - { args: [[1, 10, 100, 1000], [[30000000, 0, 0, 0], [0, 30000000, 30000000, 9999999], [1, 0, 0, 0]]], expected: [10, 1000, 1000], visible: false }
  - { args: [[250], [[3], [4]]], expected: [250, 250, 250], visible: false }
  - { args: [[10, 20], [[99, 1]]], expected: [10, 10, 10], visible: false }
