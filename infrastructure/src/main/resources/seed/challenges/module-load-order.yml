slug: module-load-order
title: Ordem de carga de módulos
area: frontend
level: senior
difficulty: medium
tags: [algoritmos, estruturas-de-dados, arquitetura]
timeLimitMs: 5000
memoryLimitKb: 262144
comparison: exact
statement: |
  Uma aplicação é dividida em módulos que se carregam uns aos outros. Dada a lista de nomes de `modules` e a lista `edges`, onde cada item `"a>b"` significa que o módulo `a` depende de `b` (portanto `b` precisa ser carregado antes de `a`), devolva uma ordem de carga válida.

  Para a resposta ser única, sempre que mais de um módulo estiver pronto para carregar (todas as dependências já carregadas), escolha o de menor nome em ordem alfabética. Se houver um ciclo de dependências, devolva uma lista vazia. Dependências repetidas contam como uma só. Todo módulo citado em `edges` está em `modules`. Os nomes têm só letras minúsculas, dígitos e hífen e não contêm `>`; compare-os em ordem lexicográfica simples (por código de caractere).

  Exemplo: `modules = ["app", "ui", "store", "api"]` e `edges = ["app>ui", "app>store", "ui>api", "store>api"]` produzem `["api", "store", "ui", "app"]`.
approachSummary: |
  É uma ordenação topológica (algoritmo de Kahn) com desempate pelo menor nome. Conte quantas dependências ainda faltam para cada módulo (ignorando arestas repetidas) e guarde, para cada módulo, quem depende dele. Mantenha o conjunto de módulos prontos numa estrutura ordenada (fila de prioridade ou conjunto ordenado), retire sempre o menor, adicione-o à resposta e libere os dependentes cujo contador chegou a zero. Se no fim a resposta tiver menos módulos que a entrada, há ciclo e o resultado é vazio. Custo O((V + E) log V) com a fila de prioridade; escolher o menor por varredura linear também serve para entradas moderadas, em O(V² + E).
