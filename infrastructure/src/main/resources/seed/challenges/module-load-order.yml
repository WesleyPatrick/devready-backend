    referenceSolution: |
      class Solution {
        loadOrder(modules, edges) {
          const missing = new Map();
          const dependents = new Map();
          for (const m of modules) {
            missing.set(m, 0);
            dependents.set(m, []);
          }
          for (const edge of new Set(edges)) {
            const cut = edge.indexOf(">");
            const from = edge.slice(0, cut);
            const to = edge.slice(cut + 1);
            missing.set(from, missing.get(from) + 1);
            dependents.get(to).push(from);
          }
          const ready = modules.filter((m) => missing.get(m) === 0);
          const order = [];
          while (ready.length > 0) {
            let best = 0;
            for (let i = 1; i < ready.length; i++) {
              if (ready[i] < ready[best]) best = i;
            }
            const next = ready.splice(best, 1)[0];
            order.push(next);
            for (const dep of dependents.get(next)) {
              missing.set(dep, missing.get(dep) - 1);
              if (missing.get(dep) === 0) ready.push(dep);
            }
          }
          return order.length === modules.length ? order : [];
        }
      }
