    referenceSolution: |
      import java.util.ArrayList;
      import java.util.HashMap;
      import java.util.HashSet;
      import java.util.List;
      import java.util.Map;
      import java.util.PriorityQueue;
      import java.util.Set;

      class Solution {
          public String[] loadOrder(String[] modules, String[] edges) {
              Map<String, Integer> missing = new HashMap<>();
              Map<String, List<String>> dependents = new HashMap<>();
              for (String m : modules) {
                  missing.put(m, 0);
                  dependents.put(m, new ArrayList<>());
              }
              Set<String> seen = new HashSet<>();
              for (String edge : edges) {
                  if (!seen.add(edge)) {
                      continue;
                  }
                  int cut = edge.indexOf('>');
                  String from = edge.substring(0, cut);
                  String to = edge.substring(cut + 1);
                  missing.put(from, missing.get(from) + 1);
                  dependents.get(to).add(from);
              }
              PriorityQueue<String> ready = new PriorityQueue<>();
              for (String m : modules) {
                  if (missing.get(m) == 0) {
                      ready.add(m);
                  }
              }
              List<String> order = new ArrayList<>();
              while (!ready.isEmpty()) {
                  String next = ready.poll();
                  order.add(next);
                  for (String dep : dependents.get(next)) {
                      int left = missing.get(dep) - 1;
                      missing.put(dep, left);
                      if (left == 0) {
                          ready.add(dep);
                      }
                  }
              }
              if (order.size() != modules.length) {
                  return new String[0];
              }
              return order.toArray(new String[0]);
          }
      }
