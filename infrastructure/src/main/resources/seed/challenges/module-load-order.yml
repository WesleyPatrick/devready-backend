    referenceSolution: |
      import heapq


      class Solution:
          def load_order(self, modules, edges):
              missing = {m: 0 for m in modules}
              dependents = {m: [] for m in modules}
              for edge in set(edges):
                  frm, to = edge.split(">")
                  missing[frm] += 1
                  dependents[to].append(frm)
              ready = [m for m in modules if missing[m] == 0]
              heapq.heapify(ready)
              order = []
              while ready:
                  nxt = heapq.heappop(ready)
                  order.append(nxt)
                  for dep in dependents[nxt]:
                      missing[dep] -= 1
                      if missing[dep] == 0:
                          heapq.heappush(ready, dep)
              return order if len(order) == len(modules) else []
