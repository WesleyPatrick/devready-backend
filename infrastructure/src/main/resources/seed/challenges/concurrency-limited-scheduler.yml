  java:
    functionName: finishTimes
    starterCode: |
      class Solution {
          public int[] finishTimes(int[] durations, int k) {
              // sua solução
              return new int[0];
          }
      }
    referenceSolution: |
      import java.util.PriorityQueue;

      class Solution {
          public int[] finishTimes(int[] durations, int k) {
              int[] result = new int[durations.length];
              PriorityQueue<Integer> running = new PriorityQueue<>();
              for (int i = 0; i < durations.length; i++) {
                  int start = 0;
                  if (running.size() >= k) {
                      start = running.poll();
                  }
                  result[i] = start + durations[i];
                  running.add(result[i]);
              }
              return result;
          }
      }
