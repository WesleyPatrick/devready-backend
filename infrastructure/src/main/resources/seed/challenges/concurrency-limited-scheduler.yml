    referenceSolution: |
      class Solution {
        finishTimes(durations, k) {
          const heap = [];
          const push = (v) => {
            heap.push(v);
            let i = heap.length - 1;
            while (i > 0) {
              const p = (i - 1) >> 1;
              if (heap[p] <= heap[i]) break;
              [heap[p], heap[i]] = [heap[i], heap[p]];
              i = p;
            }
          };
          const pop = () => {
            const top = heap[0];
            const last = heap.pop();
            if (heap.length > 0) {
              heap[0] = last;
              let i = 0;
              for (;;) {
                const l = 2 * i + 1;
                const r = l + 1;
                let m = i;
                if (l < heap.length && heap[l] < heap[m]) m = l;
                if (r < heap.length && heap[r] < heap[m]) m = r;
                if (m === i) break;
                [heap[m], heap[i]] = [heap[i], heap[m]];
                i = m;
              }
            }
            return top;
          };
          const result = [];
          for (const d of durations) {
            const start = heap.length >= k ? pop() : 0;
            const end = start + d;
            result.push(end);
            push(end);
          }
          return result;
        }
      }
