slug: concurrency-limited-scheduler
title: Agendador com limite de concorrência
area: frontend
level: senior
difficulty: medium
tags: [algoritmos, estruturas-de-dados, javascript]
timeLimitMs: 5000
memoryLimitKb: 262144
comparison: exact
statement: |
  Um cliente HTTP só pode ter `k` requisições em andamento ao mesmo tempo. Todas as tarefas chegam no instante 0, na ordem da lista `durations`, e cada uma leva o tempo indicado. Uma tarefa começa assim que houver uma vaga livre: as `k` primeiras começam em 0 e, quando uma vaga é liberada, a próxima tarefa da fila (sempre na ordem de chegada) ocupa-a no mesmo instante. Se duas vagas ficam livres no mesmo instante, as tarefas seguintes começam nesse instante, também na ordem da fila.

  Devolva, na ordem das tarefas, o instante em que cada uma termina. Tarefas com duração 0 terminam no instante em que começam.

  Limites: `0 <= n <= 10^5` tarefas, `0 <= durations[i] <= 10^4`, `1 <= k <= 10^9`. Os instantes cabem em `int`.

  Exemplo: `durations = [4, 2, 3, 1]` e `k = 2` produzem `[4, 2, 5, 5]`: as duas primeiras começam em 0; a terceira entra em 2 (termina em 5) e a quarta em 4 (termina em 5).
approachSummary: |
  Simule a fila com uma fila de prioridade (heap mínimo) dos instantes de término das tarefas em andamento. Para cada tarefa, se há menos de `k` em andamento, ela começa em 0; senão, retire o menor término do heap (a vaga que libera primeiro) e a tarefa começa nesse instante. O término é início mais duração, e ele entra no heap. Como a fila é atendida na ordem, o resultado não depende de qual vaga específica é usada. Custo O(n log min(n, k)); varrer as k vagas a cada tarefa daria O(n · k) e estoura com n e k grandes.
