    referenceSolution: |
      import heapq


      class Solution:
          def finish_times(self, durations, k):
              running = []
              result = []
              for d in durations:
                  start = 0
                  if len(running) >= k:
                      start = heapq.heappop(running)
                  end = start + d
                  result.append(end)
                  heapq.heappush(running, end)
              return result
