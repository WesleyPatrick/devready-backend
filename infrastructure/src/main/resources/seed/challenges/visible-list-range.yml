    referenceSolution: |
      class Solution {
          public int[] visibleListRange(int[] heights, int scrollTop, int viewport, int overscan) {
              int n = heights.length;
              if (n == 0 || viewport <= 0) {
                  return new int[0];
              }
              long[] prefix = new long[n + 1];
              for (int i = 0; i < n; i++) {
                  prefix[i + 1] = prefix[i] + heights[i];
              }
              long top = scrollTop;
              long bottom = top + viewport;
              if (top >= prefix[n]) {
                  return new int[0];
              }
              int lo = 1;
              int hi = n;
              while (lo < hi) {
                  int mid = (lo + hi) / 2;
                  if (prefix[mid] > top) {
                      hi = mid;
                  } else {
                      lo = mid + 1;
                  }
              }
              int first = lo - 1;
              int low = 0;
              int high = n;
              while (low < high) {
                  int mid = (low + high) / 2;
                  if (prefix[mid] >= bottom) {
                      high = mid;
                  } else {
                      low = mid + 1;
                  }
              }
              int last = Math.min(low - 1, n - 1);
              return new int[] {Math.max(0, first - overscan), Math.min(n - 1, last + overscan)};
          }
      }
