    referenceSolution: |
      class Solution {
        visibleListRange(heights, scrollTop, viewport, overscan) {
          const n = heights.length;
          if (n === 0 || viewport <= 0) return [];
          const prefix = [0];
          for (const h of heights) prefix.push(prefix[prefix.length - 1] + h);
          if (scrollTop >= prefix[n]) return [];
          const bottom = scrollTop + viewport;
          let lo = 1;
          let hi = n;
          while (lo < hi) {
            const mid = (lo + hi) >> 1;
            if (prefix[mid] > scrollTop) hi = mid;
            else lo = mid + 1;
          }
          const first = lo - 1;
          let low = 0;
          let high = n;
          while (low < high) {
            const mid = (low + high) >> 1;
            if (prefix[mid] >= bottom) high = mid;
            else low = mid + 1;
          }
          const last = Math.min(low - 1, n - 1);
          return [Math.max(0, first - overscan), Math.min(n - 1, last + overscan)];
        }
      }
