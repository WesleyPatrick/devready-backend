    referenceSolution: |
      from bisect import bisect_left, bisect_right


      class Solution:
          def visible_list_range(self, heights, scroll_top, viewport, overscan):
              n = len(heights)
              if n == 0 or viewport <= 0:
                  return []
              prefix = [0]
              for h in heights:
                  prefix.append(prefix[-1] + h)
              if scroll_top >= prefix[n]:
                  return []
              bottom = scroll_top + viewport
              first = bisect_right(prefix, scroll_top) - 1
              last = min(bisect_left(prefix, bottom) - 1, n - 1)
              return [max(0, first - overscan), min(n - 1, last + overscan)]
