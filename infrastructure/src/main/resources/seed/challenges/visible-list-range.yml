slug: visible-list-range
title: Itens visíveis numa lista virtualizada
area: frontend
level: pleno
difficulty: medium
tags: [performance-web, algoritmos, arrays]
timeLimitMs: 5000
memoryLimitKb: 262144
comparison: exact
statement: |
  Numa lista virtualizada, só os itens que aparecem na janela de rolagem são desenhados. Os itens ficam empilhados de cima para baixo, na ordem, e a altura de cada um é dada em pixels (`heights[i]`, inteiro maior que zero). O item `i` ocupa de `início` (soma das alturas anteriores) até `início + heights[i]`, sem incluir o fim.

  A janela vai de `scrollTop` até `scrollTop + viewport`, também sem incluir o fim. Devolva `[primeiro, último]`, os índices do primeiro e do último item com **ao menos um pixel** dentro da janela, ampliados em `overscan` itens para cada lado (itens extras desenhados para a rolagem não piscar), sem passar de `0` nem de `n - 1`.

  Se nenhum item aparece, devolva `[]`: lista vazia, `viewport` zero ou `scrollTop` na altura total da lista ou além. Um item que só encosta na borda (termina em `scrollTop` ou começa em `scrollTop + viewport`) não conta.

  Limites: até 100000 itens, `heights[i]` até 10000, e `scrollTop` e `viewport` entre 0 e 10^9, com a altura total até 10^9, com `overscan` de 0 a 1000.

  Exemplo: com alturas `[50, 50, 50, 50, 50]`, `scrollTop = 75`, `viewport = 100` e `overscan = 0`, a janela vai de 75 a 175 e mostra os itens de 1 a 3, então o resultado é `[1, 3]`.
approachSummary: |
  Monte as somas de prefixo `prefix[i]` (o início do item `i`, com `prefix[n]` igual à altura total) e use busca binária em vez de varrer a lista. O primeiro item visível é o primeiro `i` com `prefix[i + 1] > scrollTop`, e o último é o último `i` com `prefix[i] < scrollTop + viewport`. Se nenhum satisfaz o primeiro critério, ou a janela tem altura zero, o resultado é vazio. Depois some e subtraia o `overscan`, limitando às bordas. Construir o prefixo custa O(n) uma vez; cada consulta custa O(log n), o que importa porque a rolagem repete a consulta várias vezes por segundo sobre a mesma lista. Em Java, some em `long` para não estourar o `int` em `scrollTop + viewport`.
