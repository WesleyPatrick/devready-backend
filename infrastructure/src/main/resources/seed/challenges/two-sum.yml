slug: two-sum
title: Soma de dois números
area: backend
level: junior
difficulty: easy
tags: [arrays, hash-map, algoritmos]
timeLimitMs: 5000
memoryLimitKb: 262144
comparison: unordered
statement: |
  Dado um array de inteiros `nums` e um inteiro `target`, devolva os índices dos dois números cuja soma é igual a `target`.

  Cada entrada tem exatamente uma solução, e o mesmo elemento não pode ser usado duas vezes (mas dois elementos diferentes podem ter o mesmo valor). A ordem dos dois índices na resposta não importa.

  Exemplo: para `nums = [2, 7, 11, 15]` e `target = 9`, a resposta é `[0, 1]`, porque `2 + 7 = 9`.
approachSummary: |
  A solução com dois laços testa todos os pares em O(n²). A esperada usa um mapa de valor para índice: ao visitar `nums[i]`, procure `target - nums[i]` no mapa; se estiver lá, os índices são o guardado e `i`; se não, guarde `nums[i]` com o índice `i`. Procurar antes de guardar evita usar o mesmo elemento duas vezes. Uma passada, O(n) de tempo e O(n) de memória.
