    referenceSolution: |
      import heapq


      class Solution:
          def network_delay_time(self, times, n, k):
              graph = [[] for _ in range(n + 1)]
              for u, v, w in times:
                  graph[u].append((v, w))
              dist = [float("inf")] * (n + 1)
              dist[k] = 0
              heap = [(0, k)]
              while heap:
                  d, u = heapq.heappop(heap)
                  if d > dist[u]:
                      continue
                  for v, w in graph[u]:
                      if d + w < dist[v]:
                          dist[v] = d + w
                          heapq.heappush(heap, (dist[v], v))
              best = max(dist[1:])
              return -1 if best == float("inf") else best
