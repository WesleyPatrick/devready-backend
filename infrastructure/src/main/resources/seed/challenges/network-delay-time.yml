slug: network-delay-time
title: Tempo de propagação do sinal
area: backend
level: senior
difficulty: hard
tags: [algoritmos, estruturas-de-dados, complexidade]
timeLimitMs: 5000
memoryLimitKb: 262144
comparison: exact
statement: |
  Uma rede tem `n` nós numerados de `1` a `n`. A lista `times` descreve as arestas dirigidas: cada item é `[origem, destino, tempo]`, o tempo que o sinal leva para ir de `origem` até `destino`. Um sinal sai do nó `k` no instante 0 e segue por todas as arestas disponíveis ao mesmo tempo.

  Devolva o tempo mínimo para que todos os `n` nós tenham recebido o sinal, ou `-1` se algum nó for inalcançável a partir de `k`. Limites: `1 <= n <= 100`, `1 <= k <= n`, no máximo 6000 arestas e `0 <= tempo <= 100`. Pode haver mais de uma aresta entre o mesmo par de nós, e `n` pode ser 1 (resposta `0`).

  Exemplo: para `times = [[2,1,1],[2,3,1],[3,4,1]]`, `n = 4` e `k = 2`, a resposta é `2`.
approachSummary: |
  A pergunta é "qual o caminho mais curto de `k` até o nó mais distante", e a resposta é o maior dos menores caminhos. Como os pesos não são negativos, o algoritmo de Dijkstra resolve: monte a lista de adjacência, use uma fila de prioridade ordenada pela distância acumulada, descarte entradas desatualizadas e relaxe as arestas de cada nó retirado. No fim, se algum nó ficou sem distância, devolva -1; senão, o maior valor. Tempo O(E log V), memória O(V + E). Bellman-Ford também acerta nos limites do enunciado, mas custa O(V * E).
