    referenceSolution: |
      import java.util.ArrayDeque;
      import java.util.ArrayList;
      import java.util.Collections;
      import java.util.Deque;
      import java.util.HashMap;
      import java.util.List;
      import java.util.Map;

      class Solution {
          public String[] alertWindows(String[] lines, int limit, int window) {
              Map<String, Deque<Integer>> errors = new HashMap<>();
              Map<String, Boolean> above = new HashMap<>();
              List<Object[]> alerts = new ArrayList<>();
              for (String line : lines) {
                  if (line == null) continue;
                  String[] parts = line.trim().split("\\s+");
                  if (parts.length != 3) continue;
                  int t;
                  try {
                      t = Integer.parseInt(parts[0]);
                  } catch (NumberFormatException e) {
                      continue;
                  }
                  String service = parts[1];
                  Deque<Integer> queue = errors.computeIfAbsent(service, k -> new ArrayDeque<>());
                  while (!queue.isEmpty() && queue.peekFirst() <= t - window) {
                      queue.pollFirst();
                  }
                  if (parts[2].equals("ERROR")) {
                      queue.addLast(t);
                  }
                  boolean nowAbove = queue.size() > limit;
                  boolean wasAbove = above.getOrDefault(service, false);
                  if (nowAbove && !wasAbove) {
                      alerts.add(new Object[]{t, service});
                  }
                  above.put(service, nowAbove);
              }
              Collections.sort(
                      alerts,
                      (a, b) -> {
                          int byTime = Integer.compare((Integer) a[0], (Integer) b[0]);
                          if (byTime != 0) return byTime;
                          return ((String) a[1]).compareTo((String) b[1]);
                      });
              String[] result = new String[alerts.size()];
              for (int i = 0; i < result.length; i++) {
                  result[i] = alerts.get(i)[1] + " " + alerts.get(i)[0];
              }
              return result;
          }
      }
