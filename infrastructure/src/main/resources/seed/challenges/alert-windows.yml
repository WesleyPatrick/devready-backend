slug: alert-windows
title: Alertas por janela deslizante de erros
area: devops
level: senior
difficulty: hard
tags: [observabilidade, algoritmos, hash-map]
timeLimitMs: 5000
memoryLimitKb: 262144
comparison: exact
statement: |
  Você recebe as linhas de log de vários serviços, já em ordem não decrescente de instante. Cada linha tem três campos separados por espaço: `instante serviço status`, em que o instante é sempre um inteiro em segundos (só dígitos) e o status é `ERROR` ou `OK`. Linhas que não tenham exatamente esses três campos devem ser ignoradas. Limites: até 10^5 linhas, instantes entre 0 e 10^9, `1 <= window <= 10^9`, `limit >= 0`, e nomes de serviço com letras minúsculas, dígitos e hífen.

  As linhas são processadas uma a uma, na ordem recebida (várias linhas podem ter o mesmo instante). A cada linha de um serviço, calcule `N`: o número de linhas `ERROR` desse serviço **lidas até esta linha, inclusive**, com instante `t'` tal que `t - window < t' <= t`, em que `t` é o instante da linha. O serviço está acima do limite quando `N > limit`.

  Devolva um alerta `"serviço instante"` cada vez que um serviço passa a ficar acima do limite, isto é, quando, na avaliação de uma linha dele, `N > limit` e na avaliação anterior desse mesmo serviço `N <= limit` (ou não havia avaliação anterior). Enquanto o serviço continuar acima, não repita o alerta. Todas as linhas do serviço, inclusive as `OK`, são avaliações: uma linha `OK` é o único momento em que o serviço é reavaliado sem erro novo (por exemplo, para constatar que a janela esvaziou), e um serviço sem linhas não é reavaliado. A lista final vem ordenada por instante e, em empate, pelo nome do serviço.

  Exemplo: com `limit = 2`, `window = 10` e as linhas `1 api ERROR`, `2 api ERROR`, `3 api ERROR`, `4 api ERROR`, a resposta é `["api 3"]`. Com `limit = 0`, `window = 1` e as linhas `1 a ERROR`, `2 a OK`, `3 a ERROR`, a resposta é `["a 1", "a 3"]`: a linha `OK` do instante 2 reavalia o serviço (N = 0) e libera um novo alerta.
approachSummary: |
  Mantenha, por serviço, uma fila com os instantes dos erros dentro da janela e um indicador de "acima do limite". A cada linha do serviço, descarte da frente os instantes que saíram da janela (`<= t - window`), acrescente o atual se for erro, e compare o tamanho da fila com o limite: se passou a ficar acima e antes não estava, emita o alerta; se voltou a ficar igual ou abaixo, desligue o indicador. Cada instante entra e sai da fila uma vez, então o custo é O(n) amortizado, mais a ordenação final da saída. Os erros comuns são contar a borda da janela (usar `>=` no lugar de `>`), repetir o alerta enquanto continua acima e misturar a contagem entre serviços.
