      from collections import deque


      class Solution:
          def alert_windows(self, lines, limit, window):
              errors = {}
              above = {}
              alerts = []
              for line in lines:
                  parts = line.split()
                  if len(parts) != 3:
                      continue
                  try:
                      t = int(parts[0])
                  except ValueError:
                      continue
                  service = parts[1]
                  queue = errors.setdefault(service, deque())
                  while queue and queue[0] <= t - window:
                      queue.popleft()
                  if parts[2] == "ERROR":
                      queue.append(t)
                  now_above = len(queue) > limit
                  if now_above and not above.get(service, False):
                      alerts.append((t, service))
                  above[service] = now_above
              alerts.sort()
              return [service + " " + str(t) for t, service in alerts]
