    referenceSolution: |
      class Solution {
        alertWindows(lines, limit, window) {
          const errors = new Map();
          const above = new Map();
          const alerts = [];
          for (const line of lines) {
            const parts = line.trim().split(/\s+/);
            if (parts.length !== 3) continue;
            const t = Number(parts[0]);
            if (!Number.isInteger(t)) continue;
            const service = parts[1];
            if (!errors.has(service)) errors.set(service, []);
            const queue = errors.get(service);
            let head = 0;
            while (head < queue.length && queue[head] <= t - window) head++;
            if (head > 0) queue.splice(0, head);
            if (parts[2] === "ERROR") queue.push(t);
            const nowAbove = queue.length > limit;
            if (nowAbove && !above.get(service)) alerts.push([t, service]);
            above.set(service, nowAbove);
          }
          alerts.sort((a, b) => {
            if (a[0] !== b[0]) return a[0] - b[0];
            if (a[1] < b[1]) return -1;
            return a[1] > b[1] ? 1 : 0;
          });
          return alerts.map((a) => a[1] + " " + a[0]);
        }
      }
