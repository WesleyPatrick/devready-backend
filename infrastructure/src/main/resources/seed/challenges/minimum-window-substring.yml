slug: minimum-window-substring
title: Menor janela que contém os caracteres
area: frontend
level: senior
difficulty: hard
tags: [strings, hash-map, algoritmos]
timeLimitMs: 5000
memoryLimitKb: 262144
comparison: exact
statement: |
  Dadas duas strings `s` e `t`, devolva a menor janela contígua de `s` que contém todos os caracteres de `t`, respeitando as repetições: se `t` tem dois `a`, a janela precisa de ao menos dois `a`. `s` e `t` têm apenas letras ASCII (`a-z` e `A-Z`), com até 10^5 caracteres cada, e a comparação diferencia maiúsculas de minúsculas.

  Se não existir janela válida, ou se `t` for vazia, devolva `""`. Se houver mais de uma janela do menor tamanho, devolva a que começa mais cedo em `s`.

  Exemplo: `s = "ADOBECODEBANC"` e `t = "ABC"` produzem `"BANC"`.
approachSummary: |
  Janela deslizante com contagem. Conte quantos de cada caractere `t` exige e avance a ponta direita da janela, descontando o que for encontrado; quando todas as exigências estiverem satisfeitas, avance a ponta esquerda enquanto a janela continuar válida, registrando a menor (só troca quando é estritamente menor, o que preserva a que começa antes). Cada ponta anda no máximo n vezes, então o custo é O(|s| + |t|) de tempo e O(alfabeto) de memória (52 letras ASCII). Testar todas as janelas daria O(n²) ou pior, o que estoura com 10^5 caracteres.
