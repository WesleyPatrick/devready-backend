slug: sliding-window-maximum
title: Máximo de cada janela deslizante
area: backend
level: senior
difficulty: hard
tags: [arrays, estruturas-de-dados, complexidade]
timeLimitMs: 5000
memoryLimitKb: 262144
comparison: exact
statement: |
  Dado um array de inteiros `nums` e um inteiro `k` (com `1 <= k <= nums.length`), uma janela de tamanho `k` começa nas `k` primeiras posições e avança uma posição por vez até o fim do array. Devolva um array com o maior valor de cada posição da janela, na ordem em que ela passa.

  Existem `nums.length - k + 1` janelas. O array pode ter valores repetidos e negativos. Limites: `1 <= nums.length <= 100000` e `-10000 <= nums[i] <= 10000`. Tente chegar a O(n).

  Exemplo: para `nums = [1, 3, -1, -3, 5, 3, 6, 7]` e `k = 3`, a resposta é `[3, 3, 5, 5, 6, 7]`.
approachSummary: |
  Calcular o máximo de cada janela do zero custa O(n * k). A solução esperada usa uma deque de índices que mantém os valores em ordem decrescente: ao chegar em `i`, remova do fim os índices cujo valor é menor ou igual a `nums[i]` (nunca mais serão o máximo), acrescente `i`, remova do começo o índice que saiu da janela (`i - k`) e, quando a primeira janela estiver completa (`i >= k - 1`), o começo da deque é o máximo. Cada índice entra e sai uma vez: O(n) de tempo e O(k) de memória, a solução esperada (a força bruta, O(n * k), também passa nos limites do enunciado).
