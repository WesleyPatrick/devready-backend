      from collections import deque


      class Solution:
          def max_sliding_window(self, nums, k):
              result = []
              window = deque()
              for i, value in enumerate(nums):
                  while window and nums[window[-1]] <= value:
                      window.pop()
                  window.append(i)
                  if window[0] <= i - k:
                      window.popleft()
                  if i >= k - 1:
                      result.append(nums[window[0]])
              return result
