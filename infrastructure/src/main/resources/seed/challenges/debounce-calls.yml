  java:
    functionName: debounceCalls
    starterCode: |
      class Solution {
          public int[] debounceCalls(int[] calls, int wait, int maxWait) {
              // sua solução
              return new int[0];
          }
      }
    referenceSolution: |
      class Solution {
          public int[] debounceCalls(int[] calls, int wait, int maxWait) {
              int[] buffer = new int[calls.length];
              int count = 0;
              long lastRun = 0;
              int i = 0;
              while (i < calls.length) {
                  long start = calls[i];
                  long capFrom = start;
                  if (i > 0 && start < (long) calls[i - 1] + wait) {
                      capFrom = lastRun;
                  }
                  long due = Math.min(start + wait, capFrom + maxWait);
                  int j = i + 1;
                  while (j < calls.length && calls[j] < due) {
                      due = Math.min((long) calls[j] + wait, capFrom + maxWait);
                      j++;
                  }
                  buffer[count++] = (int) due;
                  lastRun = due;
                  i = j;
              }
              int[] result = new int[count];
              System.arraycopy(buffer, 0, result, 0, count);
              return result;
          }
      }
