    referenceSolution: |
      class Solution {
        debounceCalls(calls, wait, maxWait) {
          const runs = [];
          let i = 0;
          while (i < calls.length) {
            const start = calls[i];
            let capFrom = start;
            if (i > 0 && start < calls[i - 1] + wait) {
              capFrom = runs[runs.length - 1];
            }
            let due = Math.min(start + wait, capFrom + maxWait);
            let j = i + 1;
            while (j < calls.length && calls[j] < due) {
              due = Math.min(calls[j] + wait, capFrom + maxWait);
              j++;
            }
            runs.push(due);
            i = j;
          }
          return runs;
        }
      }
