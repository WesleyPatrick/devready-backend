      class Solution:
          def debounce_calls(self, calls, wait, max_wait):
              runs = []
              i = 0
              while i < len(calls):
                  start = calls[i]
                  cap_from = start
                  if i > 0 and start < calls[i - 1] + wait:
                      cap_from = runs[-1]
                  due = min(start + wait, cap_from + max_wait)
                  j = i + 1
                  while j < len(calls) and calls[j] < due:
                      due = min(calls[j] + wait, cap_from + max_wait)
                      j += 1
                  runs.append(due)
                  i = j
              return runs
