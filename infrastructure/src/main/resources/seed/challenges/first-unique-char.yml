slug: first-unique-char
title: Primeiro caractere único
area: backend
level: junior
difficulty: easy
tags: [strings, hash-map]
timeLimitMs: 5000
memoryLimitKb: 262144
comparison: exact
statement: |
  Dada uma string `s` com letras minúsculas sem acento, devolva o índice do primeiro caractere que aparece uma única vez na string. Se todos os caracteres se repetem, ou se a string estiver vazia, devolva `-1`.

  Exemplo: em `"entrevista"`, o `e` aparece duas vezes e o `n` aparece uma só, então a resposta é `1`. Em `"arara"`, todos se repetem e a resposta é `-1`.
approachSummary: |
  Faça duas passadas. Na primeira, conte quantas vezes cada caractere aparece, num mapa ou num array de 26 posições. Na segunda, percorra a string na ordem original e devolva o primeiro índice cujo caractere tem contagem 1. O(n) de tempo e memória constante (o alfabeto é fixo). Comparar cada caractere com todos os outros funciona, mas é O(n²).
languages:
  java:
    functionName: firstUniqueChar
    starterCode: |
      class Solution {
          public int firstUniqueChar(String s) {
              // sua solução
              return -1;
          }
      }
    referenceSolution: |
      class Solution {
          public int firstUniqueChar(String s) {
              int[] counts = new int[26];
              for (char c : s.toCharArray()) {
                  counts[c - 'a']++;
              }
              for (int i = 0; i < s.length(); i++) {
                  if (counts[s.charAt(i) - 'a'] == 1) {
                      return i;
                  }
              }
              return -1;
          }
      }
  python:
    functionName: first_unique_char
    starterCode: |
      class Solution:
          def first_unique_char(self, s):
              # sua solução
              return -1
    referenceSolution: |
      class Solution:
          def first_unique_char(self, s):
              counts = {}
              for c in s:
                  counts[c] = counts.get(c, 0) + 1
              for i, c in enumerate(s):
                  if counts[c] == 1:
                      return i
              return -1
  javascript:
    functionName: firstUniqueChar
    starterCode: |
      class Solution {
        firstUniqueChar(s) {
          // sua solução
          return -1;
        }
      }
    referenceSolution: |
      class Solution {
        firstUniqueChar(s) {
          const counts = new Map();
          for (const c of s) counts.set(c, (counts.get(c) || 0) + 1);
          for (let i = 0; i < s.length; i++) {
            if (counts.get(s[i]) === 1) return i;
          }
          return -1;
        }
      }
