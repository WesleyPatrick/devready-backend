slug: semver-sort
title: Ordenar versões semânticas
area: devops
level: pleno
difficulty: medium
tags: [ci-cd, strings, algoritmos]
timeLimitMs: 5000
memoryLimitKb: 262144
comparison: exact
statement: |
  Você recebe uma lista de versões no formato `MAJOR.MINOR.PATCH`, com um pré-lançamento opcional depois de um hífen, como `1.4.0-beta.2`. Devolva a lista em ordem crescente de precedência, segundo o SemVer 2.0:

  - compare `MAJOR`, depois `MINOR`, depois `PATCH`, **como números** (`1.10.0` vem depois de `1.2.0`);
  - com o mesmo `MAJOR.MINOR.PATCH`, uma versão **com** pré-lançamento vem antes da versão sem ele (`1.0.0-rc.1 < 1.0.0`);
  - entre dois pré-lançamentos, compare os identificadores separados por ponto, da esquerda para a direita: identificadores numéricos são comparados como números; identificadores com letras são comparados em ordem alfabética (ASCII); um identificador numérico vem antes de um alfanumérico; se todos os comuns forem iguais, o pré-lançamento com **menos** identificadores vem antes (`1.0.0-alpha < 1.0.0-alpha.1`).

  As versões são válidas: números sem zeros à esquerda, até 10^9, e no máximo 1000 versões. Não há metadados de build (`+...`). Versões iguais podem se repetir e devem ser mantidas. A lista pode estar vazia.

  Exemplo: `["1.0.0", "1.0.0-rc.1", "0.9.0"]` produz `["0.9.0", "1.0.0-rc.1", "1.0.0"]`.
approachSummary: |
  Separe cada versão no primeiro hífen: o núcleo `MAJOR.MINOR.PATCH` vira três números e o resto vira a lista de identificadores do pré-lançamento. Escreva um comparador que olhe primeiro o núcleo, depois a ausência de pré-lançamento (que ganha), depois os identificadores um a um (número contra número, texto contra texto, número antes de texto) e, por fim, o tamanho da lista. Ordene com esse comparador: O(n log n) comparações, cada uma custando o tamanho da versão. O erro clássico é comparar as strings direto, o que põe `1.10.0` antes de `1.2.0` e `1.0.0-rc.1` depois de `1.0.0`.
