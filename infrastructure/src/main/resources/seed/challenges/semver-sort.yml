    referenceSolution: |
      class Solution {
        sortVersions(versions) {
          const isNum = (s) => /^[0-9]+$/.test(s);
          const sign = (n) => (n > 0 ? 1 : n < 0 ? -1 : 0);
          const compareIds = (a, b) => {
            const aNum = isNum(a);
            const bNum = isNum(b);
            if (aNum && bNum) return sign(Number(a) - Number(b));
            if (aNum) return -1;
            if (bNum) return 1;
            return a < b ? -1 : a > b ? 1 : 0;
          };
          const split = (version) => {
            const dash = version.indexOf("-");
            const core = (dash < 0 ? version : version.slice(0, dash)).split(".").map(Number);
            const pre = dash < 0 ? null : version.slice(dash + 1).split(".");
            return { core, pre };
          };
          const compare = (x, y) => {
            const a = split(x);
            const b = split(y);
            for (let i = 0; i < 3; i++) {
              if (a.core[i] !== b.core[i]) return a.core[i] < b.core[i] ? -1 : 1;
            }
            if (a.pre === null && b.pre === null) return 0;
            if (a.pre === null) return 1;
            if (b.pre === null) return -1;
            const common = Math.min(a.pre.length, b.pre.length);
            for (let i = 0; i < common; i++) {
              const c = compareIds(a.pre[i], b.pre[i]);
              if (c !== 0) return c;
            }
            return sign(a.pre.length - b.pre.length);
          };
          return versions.slice().sort(compare);
        }
      }
