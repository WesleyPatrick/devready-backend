    referenceSolution: |
      import java.util.Arrays;

      class Solution {
          public String[] sortVersions(String[] versions) {
              String[] result = Arrays.copyOf(versions, versions.length);
              Arrays.sort(result, (a, b) -> compareVersions(a, b));
              return result;
          }

          private int compareNumbers(String a, String b) {
              if (a.length() != b.length()) {
                  return a.length() < b.length() ? -1 : 1;
              }
              return Integer.signum(a.compareTo(b));
          }

          private boolean isNumeric(String s) {
              if (s.isEmpty()) {
                  return false;
              }
              for (int i = 0; i < s.length(); i++) {
                  if (s.charAt(i) < '0' || s.charAt(i) > '9') {
                      return false;
                  }
              }
              return true;
          }

          private int compareVersions(String a, String b) {
              int dashA = a.indexOf('-');
              int dashB = b.indexOf('-');
              String coreA = dashA < 0 ? a : a.substring(0, dashA);
              String coreB = dashB < 0 ? b : b.substring(0, dashB);
              String[] partsA = coreA.split("\\.");
              String[] partsB = coreB.split("\\.");
              for (int i = 0; i < 3; i++) {
                  int c = compareNumbers(partsA[i], partsB[i]);
                  if (c != 0) {
                      return c;
                  }
              }
              if (dashA < 0 && dashB < 0) {
                  return 0;
              }
              if (dashA < 0) {
                  return 1;
              }
              if (dashB < 0) {
                  return -1;
              }
              String[] preA = a.substring(dashA + 1).split("\\.");
              String[] preB = b.substring(dashB + 1).split("\\.");
              int common = Math.min(preA.length, preB.length);
              for (int i = 0; i < common; i++) {
                  boolean numA = isNumeric(preA[i]);
                  boolean numB = isNumeric(preB[i]);
                  int c;
                  if (numA && numB) {
                      c = compareNumbers(preA[i], preB[i]);
                  } else if (numA) {
                      c = -1;
                  } else if (numB) {
                      c = 1;
                  } else {
                      c = Integer.signum(preA[i].compareTo(preB[i]));
                  }
                  if (c != 0) {
                      return c;
                  }
              }
              return Integer.compare(preA.length, preB.length);
          }
      }
