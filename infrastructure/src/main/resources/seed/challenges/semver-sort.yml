    referenceSolution: |
      import functools


      class Solution:
          def sort_versions(self, versions):
              def split(version):
                  core, _, pre = version.partition("-")
                  numbers = [int(x) for x in core.split(".")]
                  return numbers, (pre.split(".") if pre else None)

              def compare_ids(a, b):
                  a_num, b_num = a.isdigit(), b.isdigit()
                  if a_num and b_num:
                      a, b = int(a), int(b)
                  elif a_num:
                      return -1
                  elif b_num:
                      return 1
                  return (a > b) - (a < b)

              def compare(x, y):
                  nx, px = split(x)
                  ny, py = split(y)
                  if nx != ny:
                      return -1 if nx < ny else 1
                  if px is None and py is None:
                      return 0
                  if px is None:
                      return 1
                  if py is None:
                      return -1
                  for a, b in zip(px, py):
                      c = compare_ids(a, b)
                      if c != 0:
                          return c
                  return (len(px) > len(py)) - (len(px) < len(py))

              return sorted(versions, key=functools.cmp_to_key(compare))
