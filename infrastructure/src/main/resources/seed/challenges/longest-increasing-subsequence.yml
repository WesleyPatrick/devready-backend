slug: longest-increasing-subsequence
title: Maior subsequência crescente
area: frontend
level: senior
difficulty: hard
tags: [algoritmos, arrays, complexidade]
timeLimitMs: 5000
memoryLimitKb: 262144
comparison: exact
statement: |
  Dado um array de inteiros `nums`, devolva o tamanho da maior subsequência estritamente crescente. Uma subsequência mantém a ordem relativa dos elementos, mas pode pular posições; "estritamente" significa que valores iguais não contam como crescimento.

  Limites: `0 <= n <= 10^5`, e cada valor é um inteiro que cabe em `int` (pode ser negativo). Uma solução que compara todos os pares em O(n²) funciona para entradas pequenas, mas o esperado é chegar a O(n log n).

  Exemplo: `[10, 9, 2, 5, 3, 7, 101, 18]` produz `4`, por exemplo com `2, 3, 7, 101`. Para um array vazio, a resposta é `0`.
approachSummary: |
  Mantenha um vetor `tails`, em que `tails[k]` é o menor valor possível para o último elemento de uma subsequência crescente de tamanho k + 1. Para cada número, ache por busca binária a primeira posição com valor maior ou igual a ele: se estiver no fim, acrescente (a maior subsequência cresceu); senão, substitua. Como a comparação é "maior ou igual", repetidos não aumentam o tamanho. O tamanho final de `tails` é a resposta. Tempo O(n log n) e memória O(n); a programação dinâmica clássica faz O(n²).
