    starterCode: |
      class Solution {
          public int lengthOfLis(int[] nums) {
              // sua solução
              return 0;
          }
      }
    referenceSolution: |
      class Solution {
          public int lengthOfLis(int[] nums) {
              int[] tails = new int[nums.length];
              int size = 0;
              for (int x : nums) {
                  int lo = 0;
                  int hi = size;
                  while (lo < hi) {
                      int mid = (lo + hi) / 2;
                      if (tails[mid] < x) {
                          lo = mid + 1;
                      } else {
                          hi = mid;
                      }
                  }
                  tails[lo] = x;
                  if (lo == size) {
                      size++;
                  }
              }
              return size;
          }
      }
  python:
    functionName: length_of_lis
    starterCode: |
      class Solution:
          def length_of_lis(self, nums):
              # sua solução
              return 0
    referenceSolution: |
      from bisect import bisect_left


      class Solution:
          def length_of_lis(self, nums):
              tails = []
              for x in nums:
                  i = bisect_left(tails, x)
                  if i == len(tails):
                      tails.append(x)
                  else:
                      tails[i] = x
              return len(tails)
