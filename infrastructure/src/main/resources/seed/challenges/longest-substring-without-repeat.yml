slug: longest-substring-without-repeat
title: Maior substring sem repetição
area: backend
level: senior
difficulty: medium
tags: [strings, hash-map, algoritmos]
timeLimitMs: 5000
memoryLimitKb: 262144
comparison: exact
statement: |
  Dada uma string `s`, devolva o tamanho da maior substring (trecho contíguo) que não tem nenhum caractere repetido.

  A string pode ter letras (maiúsculas e minúsculas contam como caracteres diferentes), dígitos, espaços e símbolos, com `0 <= s.length <= 50000`. Uma string vazia tem resposta `0`.

  Exemplo: para `s = "abcabcbb"`, a resposta é `3`, por causa de `"abc"`. Para `s = "bbbbb"`, é `1`. Para `s = "pwwkew"`, é `3` (`"wke"`; note que `"pwke"` não serve, porque não é contígua).
approachSummary: |
  Testar todas as substrings custa O(n²) ou pior. A solução esperada é a janela deslizante: mantenha um mapa do último índice em que cada caractere apareceu e um início `left` da janela. Ao ler `s[i]`, se ele já apareceu dentro da janela (último índice maior ou igual a `left`), mova `left` para esse índice mais um; depois registre o índice atual e atualize o melhor tamanho com `i - left + 1`. Uma passada: O(n) de tempo e O(k) de memória, com k o tamanho do alfabeto.
