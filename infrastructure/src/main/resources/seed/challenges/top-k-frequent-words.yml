slug: top-k-frequent-words
title: Ranking das k palavras mais comuns
area: backend
level: pleno
difficulty: medium
tags: [hash-map, strings, algoritmos]
timeLimitMs: 5000
memoryLimitKb: 262144
comparison: exact
statement: |
  Dada uma lista de palavras com letras minúsculas de `a` a `z`, sem acento, e um inteiro `k`, devolva as `k` palavras que mais aparecem, da mais frequente para a menos frequente. Em caso de empate na frequência, vem primeiro a palavra que é menor em ordem alfabética.

  Exemplo: `["sol", "chuva", "sol", "vento", "chuva", "sol"]` com `k = 2` produz `["sol", "chuva"]`. Vale `0 <= k <=` quantidade de palavras distintas.
approachSummary: |
  Conte as ocorrências com um mapa de palavra para frequência. Depois ordene as palavras distintas por frequência decrescente e, no empate, em ordem alfabética, e devolva as `k` primeiras: O(n + d log d) para n palavras e d distintas. Com um heap de tamanho `k` o custo da seleção cai para O(n + d log k), o que compensa quando `k` é pequeno perto de `d`. Ordenar a lista original também junta as repetidas e permite contar por sequência, mas custa O(n log n) sobre todas as palavras, e não só sobre as distintas.
