    referenceSolution: |
      class Solution:
          def top_k_frequent(self, words, k):
              counts = {}
              for word in words:
                  counts[word] = counts.get(word, 0) + 1
              ordered = sorted(counts, key=lambda word: (-counts[word], word))
              return ordered[:k]
