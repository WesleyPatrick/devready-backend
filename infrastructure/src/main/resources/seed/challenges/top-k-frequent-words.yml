    referenceSolution: |
      class Solution {
        topKFrequent(words, k) {
          const counts = new Map();
          for (const word of words) {
            counts.set(word, (counts.get(word) || 0) + 1);
          }
          const distinct = Array.from(counts.keys());
          distinct.sort((a, b) => {
            if (counts.get(a) !== counts.get(b)) return counts.get(b) - counts.get(a);
            return a < b ? -1 : a > b ? 1 : 0;
          });
          return distinct.slice(0, k);
        }
      }
testCases:
  - { args: [["sol", "chuva", "sol", "vento", "chuva", "sol"], 2], expected: ["sol", "chuva"], visible: true }
  - { args: [["a", "b", "c", "b", "a", "d", "d", "d"], 3], expected: ["d", "a", "b"], visible: true }
  - { args: [[], 0], expected: [], visible: false }
