      class Solution {
        moveZeroes(nums) {
          let write = 0;
          for (let i = 0; i < nums.length; i++) {
            if (nums[i] !== 0) {
              nums[write++] = nums[i];
            }
          }
          while (write < nums.length) {
            nums[write++] = 0;
          }
          return nums;
        }
      }
