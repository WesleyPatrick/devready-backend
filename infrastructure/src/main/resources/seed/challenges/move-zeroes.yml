slug: move-zeroes
title: Mover zeros para o fim
area: backend
level: pleno
difficulty: easy
tags: [arrays, algoritmos]
timeLimitMs: 5000
memoryLimitKb: 262144
comparison: exact
statement: |
  Dado um array de inteiros, mova todos os zeros para o fim, mantendo a ordem relativa dos elementos diferentes de zero. Devolva o array resultante.

  Exemplo: `[0, 1, 0, 3, 12]` produz `[1, 3, 12, 0, 0]`. O array pode estar vazio ou ter só zeros.
approachSummary: |
  Use dois ponteiros: um percorre o array e o outro marca a próxima posição de escrita. Cada elemento diferente de zero é copiado para a posição de escrita, que avança; ao final, as posições restantes são preenchidas com zero. Uma única passada, O(n) de tempo e O(1) de memória extra se feito no próprio array. Criar uma lista só com os não zeros e completar com zeros também é O(n), mas gasta memória a mais; remover cada zero e deslocar o resto custaria O(n²).
languages:
  java:
    functionName: moveZeroes
    starterCode: |
      class Solution {
          public int[] moveZeroes(int[] nums) {
              // sua solução
              return nums;
          }
      }
    referenceSolution: |
      class Solution {
          public int[] moveZeroes(int[] nums) {
              int write = 0;
              for (int i = 0; i < nums.length; i++) {
                  if (nums[i] != 0) {
                      nums[write++] = nums[i];
                  }
              }
              while (write < nums.length) {
                  nums[write++] = 0;
              }
              return nums;
          }
      }
