    referenceSolution: |
      class Solution:
          def parse_env(self, lines):
              env = {}
              for raw in lines:
                  line = raw.strip()
                  if not line or line.startswith("#") or "=" not in line:
                      continue
                  key, value = line.split("=", 1)
                  key = key.strip()
                  if key:
                      env[key] = value.strip()
              return [key + "=" + env[key] for key in sorted(env)]
