    referenceSolution: |
      class Solution {
        parseEnv(lines) {
          const env = new Map();
          for (const raw of lines) {
            const line = raw.trim();
            if (line === "" || line.startsWith("#")) continue;
            const eq = line.indexOf("=");
            if (eq < 0) continue;
            const key = line.slice(0, eq).trim();
            if (key === "") continue;
            env.set(key, line.slice(eq + 1).trim());
          }
          return [...env.keys()]
            .sort((a, b) => (a < b ? -1 : a > b ? 1 : 0))
            .map((key) => key + "=" + env.get(key));
        }
      }
testCases:
  - { args: [["# banco", "DB_PORT=5432", "  APP_NAME = devready ", "DB_HOST=localhost"]], expected: ["APP_NAME=devready", "DB_HOST=localhost", "DB_PORT=5432"], visible: true }
  - { args: [["PORT=8080", "", "DEBUG=false", "PORT = 9090"]], expected: ["DEBUG=false", "PORT=9090"], visible: true }
  - { args: [[]], expected: [], visible: false }
  - { args: [["# só comentário", "   ", "LINHA_SEM_IGUAL"]], expected: [], visible: false }
  - { args: [["URL=postgres://db:5432/app?ssl=true", "EMPTY="]], expected: ["EMPTY=", "URL=postgres://db:5432/app?ssl=true"], visible: false }
  - { args: [["=sem_chave", "   # comentário com espaço antes", "B=2", "A=1"]], expected: ["A=1", "B=2"], visible: false }
  - { args: [["NAME=\"Dev Ready\"", "COLOR=#fff # tema"]], expected: ["COLOR=#fff # tema", "NAME=\"Dev Ready\""], visible: false }
