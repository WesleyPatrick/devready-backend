slug: parse-env-file
title: Normalizar arquivo de variáveis de ambiente
area: devops
level: junior
difficulty: medium
tags: [shell, strings, hash-map]
timeLimitMs: 5000
memoryLimitKb: 262144
comparison: exact
statement: |
  Você recebe as linhas de um arquivo `.env`. Devolva as variáveis normalizadas no formato `CHAVE=valor`, ordenadas pela chave em ordem de bytes, como `LC_ALL=C sort`.

  Regras:
  - Ignore linhas vazias, linhas só com espaços e comentários (linhas que, depois de tirar os espaços das pontas, começam com `#`).
  - Separe cada linha no primeiro `=`; o valor pode conter outros `=`. Tire os espaços das pontas da chave e do valor.
  - Ignore linhas sem `=` e linhas com a chave vazia. O valor pode ser vazio.
  - Aspas e `#` no meio da linha fazem parte do valor; não há tratamento especial para eles.
  - Se a mesma chave aparecer mais de uma vez, vale a última.

  Exemplo: as linhas `"# banco"`, `"DB_PORT=5432"`, `"  APP_NAME = devready "` e `"DB_HOST=localhost"` produzem `["APP_NAME=devready", "DB_HOST=localhost", "DB_PORT=5432"]`.
approachSummary: |
  Percorra as linhas uma vez: tire os espaços das pontas, descarte vazias e comentários, localize o primeiro `=` com `indexOf` (não `split`, que quebraria valores com `=`), limpe chave e valor e grave num mapa, o que já faz a última ocorrência vencer. No fim, ordene as chaves e monte `CHAVE=valor`. O(n) para ler e O(k log k) para ordenar as k chaves; usar um mapa ordenado (`TreeMap` em Java) resolve as duas coisas de uma vez.
